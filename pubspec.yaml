name: streamgate_flutter
description: StreamGate Mobile App

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  image_picker: ^1.2.2
  flutter_riverpod: ^2.6.1
  provider: ^6.1.2

  path_provider: ^2.1.5
  video_player: ^2.11.1
  chewie: ^1.13.1

  share_plus: ^10.0.0
  camera: ^0.10.0+1

  path: ^1.9.1
  webview_flutter: ^4.7.0
  dio: ^5.3.2

  flutter_screen_recording: ^2.0.25
  permission_handler: ^11.0.0

  fastpix_resumable_uploader:
    git:
      url: https://github.com/FastPix/flutter-uploads
      ref: 1544804efddef484909ade79c44ebfee401d5d02

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/icon/